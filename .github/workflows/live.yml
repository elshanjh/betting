# Live engine: while a match is live it updates scores and live odds every
# 20s. On match days each run starts the next one when it ends, because
# GitHub's own schedule often fires only every few hours; the schedule just
# restarts the chain. Free for public repos. Uses FIREBASE_SERVICE_ACCOUNT.
name: Live engine

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write # to start the next run

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - id: live
        run: node scripts/live.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # GitHub sometimes skips scheduled runs for hours; syncing here too
      # means results get paid out whenever either workflow gets to run.
      - run: node scripts/sync.mjs
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # Starting a workflow with the built-in token is allowed for
      # workflow_dispatch, so the engine keeps going between scheduled runs.
      - if: always() && steps.live.outputs.again == 'true'
        run: gh workflow run live.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
