# Every hour: load fixtures + odds and final scores from ESPN, settle bets.
# Needs one repository secret (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT  the full JSON of a Firebase service account key
name: Sync odds and results

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/sync.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Optional, ESPN league slugs (see README):
          # LEAGUES: eng.1,esp.1,ita.1,ger.1,fra.1,uefa.champions
