# Every 2 hours: fetch fixtures/odds and results, settle bets.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   ODDS_API_KEY              your key from the-odds-api.com
#   FIREBASE_SERVICE_ACCOUNT  the full JSON of a Firebase service account key
name: Sync odds and results

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/sync.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Optional overrides, see scripts/sync.mjs:
          # LEAGUES: soccer_epl,soccer_spain_la_liga,soccer_italy_serie_a
