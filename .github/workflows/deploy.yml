# On every push to main: deploy the app, security rules and indexes to
# Firebase. Uses the same FIREBASE_SERVICE_ACCOUNT secret as the sync job.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Service account
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$(node -p "require('$RUNNER_TEMP/sa.json').project_id")" >> "$GITHUB_ENV"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Fill in the web config
        run: node scripts/web-config.mjs "$PROJECT_ID"
      - name: Deploy
        run: npx firebase deploy --only hosting,firestore --project "$PROJECT_ID" --non-interactive --force
      - run: echo "Live at https://$PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"
