<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Friendly Stakes</title>
<meta name="description" content="Bet on real football fixtures with pretend coins. 100 free every day.">
<meta name="theme-color" content="#0b1620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stakes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="logo" href="./" id="homeLink" aria-label="Friendly Stakes, home"><span class="logo-mark" aria-hidden="true">FS</span><span class="logo-name">Friendly<b>Stakes</b></span></a>
    <div class="bar-right">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">EN</button><button data-lang="az" aria-pressed="false">AZ</button>
      </div>
      <div class="wallet" id="wallet"></div>
      <button class="acct" id="acctBtn" hidden aria-label="Account"><span aria-hidden="true">👤</span></button>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-tab="matches" aria-selected="true"><span class="ti" aria-hidden="true">⚽</span><span data-i18n="Sports">Sports</span></button>
    <button data-tab="live" aria-selected="false"><span class="ti" aria-hidden="true"><span class="dot"></span></span><span data-i18n="Live">Live</span> <span class="badge red" id="liveCount" hidden></span></button>
    <button data-tab="mine" aria-selected="false"><span class="ti" aria-hidden="true">🧾</span><span data-i18n="My bets">My bets</span> <span class="badge" id="openCount" hidden></span></button>
    <button data-tab="board" aria-selected="false"><span class="ti" aria-hidden="true">🏆</span><span data-i18n="Table">Table</span></button>
  </nav>

  <div class="app" id="app" data-tab="matches">
    <div class="main">
      <section class="panel" id="p-matches">
        <div class="filters">
          <div class="ddl" id="leagueDd">
            <button type="button" class="ddl-btn" id="leagueBtn" aria-haspopup="listbox" aria-expanded="false"></button>
            <div class="ddl-menu" id="leagueMenu" role="listbox" hidden></div>
          </div>
          <div class="chips" id="days" role="group" aria-label="Day">
            <button class="chip" data-day="all" aria-pressed="true" data-i18n="All days">All days</button>
            <button class="chip" data-day="today" aria-pressed="false" data-i18n="Today">Today</button>
            <button class="chip" data-day="tomorrow" aria-pressed="false" data-i18n="Tomorrow">Tomorrow</button>
            <button class="chip" data-day="weekend" aria-pressed="false" data-i18n="Weekend">Weekend</button>
          </div>
          <input type="search" id="search" data-i18n-ph="Search a team" placeholder="Search a team" autocomplete="off">
        </div>
        <div class="list" id="matches"></div>
      </section>
      <section class="panel" id="p-live">
        <h2 class="ph" data-i18n="Live now">Live now</h2>
        <div id="live"></div>
      </section>
      <section class="panel" id="p-mine">
        <h2 class="ph" data-i18n="My bets">My bets</h2>
        <div id="mine"></div>
      </section>
      <section class="panel" id="p-board">
        <h2 class="ph" data-i18n="Table">Table</h2>
        <div id="board"></div>
        <h3 data-i18n="Latest bets">Latest bets</h3>
        <div id="feed"></div>
      </section>
      <footer id="foot"></footer>
    </div>
    <aside class="side">
      <section class="slip-wrap" id="slip" aria-label="Bet slip"></section>
    </aside>
  </div>
</div>

<button class="slipbar" id="slipBar" hidden></button>
<div class="scrim" id="scrim" hidden></div>

<dialog id="confirmDlg" aria-labelledby="confirmTitle">
  <form method="dialog" class="dlg">
    <h2 id="confirmTitle"></h2>
    <div id="confirmBody"></div>
    <div class="dlg-actions">
      <button class="btn ghost" value="cancel" data-i18n="Cancel">Cancel</button>
      <button class="btn" value="ok" id="confirmOk" data-i18n="Yes, place it">Yes, place it</button>
    </div>
  </form>
</dialog>

<dialog id="accountDlg" aria-labelledby="accountTitle">
  <form method="dialog" class="dlg" id="accountForm">
    <h2 id="accountTitle" data-i18n="Your account">Your account</h2>
    <p class="muted" id="accountWho"></p>
    <label class="field"><span data-i18n="Name on the table">Name on the table</span><input type="text" id="accountName" maxlength="20" autocomplete="nickname"></label>
    <div class="field">
      <span><span data-i18n="Favourite teams">Favourite teams</span> <small class="muted" id="favCount"></small></span>
      <div class="favs" id="favList"></div>
      <div class="fav-add">
        <input type="text" id="favIn" list="teamList" data-i18n-ph="Type a team, e.g. Qarabağ" placeholder="Type a team" autocomplete="off">
        <button class="btn ghost" type="button" id="favAdd" data-i18n="Add">Add</button>
      </div>
      <datalist id="teamList"></datalist>
      <small class="muted" data-i18n="Their matches show first in Sports and Live.">Their matches show first in Sports and Live.</small>
    </div>
    <div class="dlg-actions">
      <button class="btn danger" value="logout" id="logoutBtn" data-i18n="Log out">Log out</button>
      <span class="grow"></span>
      <button class="btn ghost" value="cancel" data-i18n="Close">Close</button>
      <button class="btn" value="save" id="accountSave" data-i18n="Save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="resultDlg" aria-labelledby="resultTitle">
  <form method="dialog" class="dlg result">
    <div class="big" id="resultEmoji" aria-hidden="true"></div>
    <h2 id="resultTitle"></h2>
    <p id="resultMsg"></p>
    <div id="resultList"></div>
    <div class="dlg-actions"><button class="btn" value="ok" data-i18n="I accept my fate">I accept my fate</button></div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
